# Alembic configuration.
# The database URL is intentionally NOT hard-coded here — env.py reads it from
# the application settings (single source of truth), so migrations always target
# the same database the app uses.
[alembic]
script_location = alembic
prepend_sys_path = .
# Use a timestamp + slug for migration filenames so history reads chronologically.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s
version_path_separator = os

[post_write_hooks]
# Auto-format generated migrations with ruff so they pass the same gate as app code.
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
