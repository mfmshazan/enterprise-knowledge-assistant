# =============================================================================
# Enterprise Knowledge Assistant — local development stack.
#
#   make up      -> docker compose up -d --build
#   make down    -> docker compose down
#
# Design notes:
# * Every service reads secrets from the single root `.env` file.
# * Datastores expose named volumes so data survives `down` (use `down -v` to
#   wipe). Ports are published to the host for direct inspection during dev.
# * `depends_on: condition: service_healthy` makes the API wait until Postgres,
#   Redis, and Qdrant are actually ready — not just started — preventing the
#   classic "connection refused on boot" race.
# * This file is dev-oriented (bind mounts, hot reload). A hardened
#   `docker-compose.prod.yml` overlay comes in Phase 8.
# =============================================================================

services:
  # ---------- PostgreSQL: source of truth ----------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eka}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eka_password}
      POSTGRES_DB: ${POSTGRES_DB:-eka}
    ports:
      # Host 5433 -> container 5432 to avoid clashing with a natively installed
      # PostgreSQL on the common 5432 port. In-cluster services still use 5432.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eka} -d ${POSTGRES_DB:-eka}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------- Redis: cache, task queue, sessions ----------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------- Qdrant: vector index ----------
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST + web UI
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # Qdrant's slim image has no curl; use the TCP readiness endpoint via bash.
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------- MinIO: S3-compatible object storage ----------
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------- Create the documents bucket on first boot ----------
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-minioadmin} ${S3_SECRET_KEY:-minioadmin} &&
      mc mb --ignore-existing local/${S3_BUCKET:-eka-documents} &&
      echo 'Bucket ready.'
      "
    restart: "no"

  # ---------- Backend API ----------
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      # Override host-based URLs with in-network service names.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-eka}:${POSTGRES_PASSWORD:-eka_password}@postgres:5432/${POSTGRES_DB:-eka}
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      S3_ENDPOINT_URL: http://minio:9000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio:
        condition: service_healthy

  # ---------- Frontend web app ----------
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  minio_data:
